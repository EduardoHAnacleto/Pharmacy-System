server {
    listen 80;
    server_name localhost;

    client_max_body_size 30M;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle was going out uncompressed: 360 kB of JavaScript and 309 kB of
    # CSS on the wire, for files the build already reports as 125 kB and 45 kB
    # gzipped. This is the cheapest thing this file can do for a customer on
    # mobile data.
    #
    # comp_level 5 rather than the maximum: past it the CPU cost climbs and the
    # byte count barely moves. Images are deliberately absent from the type
    # list - PNG, JPEG and WebP are already compressed, and running them through
    # gzip spends CPU to make them very slightly larger.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # WARNING, before adding any add_header at server level: nginx inherits
    # add_header from an outer block only when the inner block declares none of
    # its own. Three of the four locations below now set one, so a Content-Security
    # -Policy or X-Frame-Options added at the top of this file would silently
    # apply to nothing — including every HTML response, since `/` and `/cart`
    # both reach `= /index.html` by internal redirect. Repeat such headers in
    # each location, or put them in a file and `include` it into all of them.

    # Vite fingerprints these filenames, so the bytes behind any one of them can
    # never change. Saying so turns a repeat visit into no requests at all;
    # without it nginx sends only an ETag and every asset still costs a round
    # trip to be told it has not changed.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point is the one file that must never be cached hard: it names
    # the fingerprinted bundles, so a stale copy pins a visitor to a deployment
    # that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /promotionsHub {
        proxy_pass http://backend:80/promotionsHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded promotion artwork. Served by the API, and cacheable for a day:
    # the filename is a GUID assigned at upload, so the bytes behind one never
    # change either - but unlike /assets/ these are user data, and a shorter
    # window keeps a mistaken upload from being pinned in caches for a year.
    location /images/ {
        proxy_pass http://backend:80/images/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }
}
