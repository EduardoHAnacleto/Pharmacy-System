<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d6efd" />

    <title>Promoções</title>
    <meta
      name="description"
      content="Confira as promoções da semana e monte seu pedido para retirada ou entrega."
    />

    <!--
      OPEN GRAPH

      Static, because a link preview is generated by a crawler that does not run
      JavaScript — a title written from store_settings after mount would never be
      seen by WhatsApp or Facebook. Per-promotion previews need the page rendered
      on the server; see docs/PLANO_DE_MELHORIAS.md for that gap.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Promoções" />
    <meta
      property="og:description"
      content="Confira as promoções da semana e monte seu pedido para retirada ou entrega."
    />
    <meta property="og:image" content="/logoFarma.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
