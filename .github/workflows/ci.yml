name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Restores the solution, which now also carries the test project.
      - name: Restore
        run: dotnet restore
        working-directory: backend

      # The project sets TreatWarningsAsErrors, so a new analyzer warning fails
      # here rather than accumulating.
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # A solution file sits next to the project, so the workspace is explicit.
      - name: Format
        run: dotnet format Storefront.Api.csproj --no-restore --verify-no-changes
        working-directory: backend

      # Catches a model change committed without its migration, which would
      # otherwise only surface when the migrator runs against a real database.
      - name: Check for model changes without a migration
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 9.* >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          # --configuration must match the Build step: with --no-build the tool
          # loads the already-compiled assembly and defaults to looking in
          # bin/Debug, which this job never produces.
          dotnet ef migrations has-pending-model-changes \
            --no-build --configuration Release

      # Integration tests start throwaway MySQL and Redis containers through
      # Testcontainers, using the Docker daemon the runner already provides. They
      # skip rather than fail where there is none.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Matches the node:20-alpine base image used by frontend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint .

      - name: Format
        run: npx prettier --check src/

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only. The config also declares firefox and webkit for local
      # cross-browser runs; installing all three here triples the job for little
      # extra signal on a storefront this size.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build-only

      # playwright.config.ts starts `npm run preview` on CI and drives the built
      # bundle. The API is stubbed per test, so no backend is needed.
      - name: Run
        run: npx playwright test --project=chromium
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env.example carries every key the compose files reference, with the
      # secrets left empty. Those empty values now trip the `:?` guards, so the
      # stacks are validated against a copy with placeholders substituted in.
      # The copy is derived from .env.example rather than written as a fixture,
      # so a key the example does not document stays undocumented here too.
      - name: Fill the example with placeholders
        run: sed -E 's/^([A-Z][A-Z0-9_]*)=$/\1=ci-placeholder/' .env.example > .env.ci

      # Interpolating an undocumented variable is only fatal when it carries a
      # `:?` guard; a bare one is substituted with an empty string and compose
      # merely warns. That warning is promoted to a failure here, so every
      # variable compose reads has to exist in .env.example whether it is
      # guarded or not.
      - name: Validate both stacks
        run: |
          validate() {
            local label="$1"; shift
            if ! docker compose --env-file .env.ci "$@" config --quiet 2>compose.err; then
              cat compose.err >&2
              echo "::error::$label: compose configuration is invalid"
              return 1
            fi
            if grep -q 'variable is not set' compose.err; then
              cat compose.err >&2
              echo "::error::$label: compose reads a variable that .env.example" \
                   "does not document; add it to .env.example"
              return 1
            fi
            echo "ok: $label"
          }
          validate production
          validate development -f docker-compose.yml -f docker-compose.dev.yml

      # Asserts the guards themselves still exist: the unfilled example must be
      # rejected. Without this, dropping a `:?` would go unnoticed — every step
      # above would keep passing, and the silent-empty-value failure that this
      # guards against would quietly come back.
      - name: The unfilled example must be rejected
        run: |
          if docker compose --env-file .env.example config --quiet 2>/dev/null; then
            echo "::error::.env.example validated with its secrets empty;" \
                 "a required variable lost its ':?' guard in docker-compose.yml"
            exit 1
          fi
          echo "ok: empty required variables are rejected"
