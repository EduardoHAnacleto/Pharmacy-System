name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Restores the solution, which now also carries the test project.
      - name: Restore
        run: dotnet restore
        working-directory: backend

      # The project sets TreatWarningsAsErrors, so a new analyzer warning fails
      # here rather than accumulating.
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      # A solution file sits next to the project, so the workspace is explicit.
      - name: Format
        run: dotnet format PharmacyWorkerAPI.csproj --no-restore --verify-no-changes
        working-directory: backend

      # Catches a model change committed without its migration, which would
      # otherwise only surface when the migrator runs against a real database.
      - name: Check for model changes without a migration
        working-directory: backend
        run: |
          dotnet tool install --global dotnet-ef --version 9.* >/dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          # --configuration must match the Build step: with --no-build the tool
          # loads the already-compiled assembly and defaults to looking in
          # bin/Debug, which this job never produces.
          dotnet ef migrations has-pending-model-changes \
            --no-build --configuration Release

      # Integration tests start throwaway MySQL and Redis containers through
      # Testcontainers, using the Docker daemon the runner already provides. They
      # skip rather than fail where there is none.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Matches the node:20-alpine base image used by frontend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint .

      - name: Format
        run: npx prettier --check src/

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build-only

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only. The config also declares firefox and webkit for local
      # cross-browser runs; installing all three here triples the job for little
      # extra signal on a storefront this size.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build-only

      # playwright.config.ts starts `npm run preview` on CI and drives the built
      # bundle. The API is stubbed per test, so no backend is needed.
      - name: Run
        run: npx playwright test --project=chromium
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env.example carries every key the compose files reference, with empty
      # values. This catches a variable added to compose but never documented,
      # and any YAML or interpolation mistake.
      - name: Validate production stack
        run: docker compose --env-file .env.example config --quiet

      - name: Validate development stack
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml -f docker-compose.dev.yml config --quiet
