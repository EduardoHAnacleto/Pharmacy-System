name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Matches the node:20-alpine base image used by frontend/Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npx eslint .

      - name: Format
        run: npx prettier --check src/

      - name: Build
        run: npm run build-only

  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env.example carries every key the compose files reference, with empty
      # values. This catches a variable added to compose but never documented,
      # and any YAML or interpolation mistake.
      - name: Validate production stack
        run: docker compose --env-file .env.example config --quiet

      - name: Validate development stack
        run: |
          docker compose --env-file .env.example \
            -f docker-compose.yml -f docker-compose.dev.yml config --quiet
