# Deliberately NOT renamed alongside the project.
#
# The compose project name prefixes every volume: db_data is really
# pharmacy-system_db_data on disk. Changing it here would leave a running
# deployment's database, Redis appendonly file and uploaded images orphaned
# behind their old prefix, and bring the stack up empty — a data loss dressed as
# a rename. Anyone who wants it neutral must migrate the volumes first; the
# procedure is in docs/OPERACOES.md.
name: pharmacy-system

# Required variables carry a `:?` guard, so an absent or empty value stops
# compose at load time with the variable's name and how to fix it. Without the
# guard an empty value is substituted silently and the failure surfaces much
# later and much less clearly — an empty MYSQL_ROOT_PASSWORD reaches the MySQL
# entrypoint, which refuses to initialise and leaves the stack looping on an
# unhealthy container.
#
# One guard per variable is enough: compose interpolates the whole file before
# starting anything, so the guard fires even when the service holding it is not
# part of the command. Later reuses of the same variable are left bare on
# purpose — repeating the message on every line costs readability and buys
# nothing.
services:
  # ==========================
  # DATABASE
  # ==========================
  db:
    image: mysql:8.0
    container_name: storefront_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set it in .env, see .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set it in .env, see .env.example}
      MYSQL_USER: ${MYSQL_USER:?set it in .env, see .env.example}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set it in .env, see .env.example}
    # Not published to the host: the database is only reachable from the
    # internal storefront_network. Use `docker compose exec db mysql ...` for
    # maintenance, or docker-compose.dev.yml to expose it locally.
    # No entrypoint init scripts: the schema is owned by EF Core migrations,
    # applied by the migrator service. Entrypoint scripts only ever ran against
    # an empty volume, which made schema changes impossible after first boot.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - storefront_network

  # ==========================
  # REDIS CACHE
  # ==========================
  redis:
    image: redis:7
    container_name: storefront_redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set it in .env, see .env.example}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - storefront_network

  # ==========================
  # MIGRATOR (runs once, then exits)
  # ==========================
  migrator:
    build:
      context: ./backend
      target: migrator
    image: ghcr.io/eduardohanacleto/storefront-migrator:latest
    container_name: storefront_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      - --connection
      - server=db;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
    networks:
      - storefront_network

  # ==========================
  # BACKEND (.NET API)
  # ==========================
  backend:
    build:
      context: ./backend
      target: api
    image: ghcr.io/eduardohanacleto/storefront-backend:latest
    container_name: storefront_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the schema to be current before serving traffic.
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        server=db;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?set it in .env, see .env.example}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set it in .env, see .env.example}
      # Used only while the users table is empty; see DatabaseSeeder. Optional
      # on purpose, and therefore NOT guarded: a redeploy over a database that
      # already has its admin account does not need them, and the seeder skips
      # with a warning when either is empty. Guarding them would break exactly
      # the deployment that has nothing left to seed.
      AdminSeed__Username: ${ADMIN_SEED_USERNAME:-}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD:-}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      # Seed the store_settings row once, while the table is empty, so a new
      # deployment arrives presentable. After that the admin screen owns these —
      # changing them here has no effect.
      Store__Name: ${STORE_NAME:-}
      Store__Currency: ${STORE_CURRENCY:-}
      Store__Locale: ${STORE_LOCALE:-}
      Store__CountryCode: ${STORE_COUNTRY_CODE:-}
      Store__TimeZone: ${STORE_TIME_ZONE:-}
      Store__LogoUrl: ${STORE_LOGO_URL:-}
      # The exception: this one is also a live override. While it is set it wins
      # over the stored row on every read, so the number can be changed here and
      # picked up with a restart — no rebuild, and nothing baked into the bundle.
      # Leave it empty to let the admin screen own the number.
      Store__WhatsAppNumber: ${STORE_WHATSAPP_NUMBER:-}
      # How long raw analytics events are kept before the daily rollup replaces
      # them. 90 days is the agreed default; reports read analytics_daily, which is
      # never purged.
      Analytics__RawRetentionDays: ${ANALYTICS_RAW_RETENTION_DAYS:-90}
      # Traces and metrics are exported only when a collector is configured;
      # instrumentation runs either way.
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-}
      OpenTelemetry__ServiceName: ${OTEL_SERVICE_NAME:-storefront-api}
    volumes:
      # Uploaded promotion images. Without this the container filesystem is
      # discarded on every rebuild and the database is left pointing at
      # image URLs that no longer resolve.
      - promotion_images:/app/wwwroot/images
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:80/health/ready || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - storefront_network

  # ==========================
  # FRONTEND (Vue + Nginx)
  # ==========================
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/eduardohanacleto/storefront-frontend:latest
    container_name: storefront_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - storefront_network

# ==========================
# VOLUMES
# ==========================
volumes:
  db_data:
  redis_data:
  promotion_images:

# ==========================
# NETWORK
# ==========================
networks:
  storefront_network:
    driver: bridge
