name: pharmacy-system

services:
  # ==========================
  # DATABASE
  # ==========================
  db:
    image: mysql:8.0
    container_name: pharmacy_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Not published to the host: the database is only reachable from the
    # internal pharmacy_network. Use `docker compose exec db mysql ...` for
    # maintenance, or docker-compose.dev.yml to expose it locally.
    # No entrypoint init scripts: the schema is owned by EF Core migrations,
    # applied by the migrator service. Entrypoint scripts only ever ran against
    # an empty volume, which made schema changes impossible after first boot.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pharmacy_network

  # ==========================
  # REDIS CACHE
  # ==========================
  redis:
    image: redis:7
    container_name: pharmacy_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pharmacy_network

  # ==========================
  # MIGRATOR (runs once, then exits)
  # ==========================
  migrator:
    build:
      context: ./backend
      target: migrator
    image: ghcr.io/eduardohanacleto/pharmacy-migrator:latest
    container_name: pharmacy_migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command:
      - --connection
      - server=db;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
    networks:
      - pharmacy_network

  # ==========================
  # BACKEND (.NET API)
  # ==========================
  backend:
    build:
      context: ./backend
      target: api
    image: ghcr.io/eduardohanacleto/pharmacy-backend:latest
    container_name: pharmacy_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the schema to be current before serving traffic.
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >-
        server=db;port=3306;database=${MYSQL_DATABASE};user=${MYSQL_USER};password=${MYSQL_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Used only while the users table is empty; see DatabaseSeeder.
      AdminSeed__Username: ${ADMIN_SEED_USERNAME}
      AdminSeed__Password: ${ADMIN_SEED_PASSWORD}
      AdminSeed__Email: ${ADMIN_SEED_EMAIL:-}
      # Initial store_settings row, written once while the table is empty, so a new
      # deployment arrives presentable. After that the admin screen owns these —
      # changing them here has no effect.
      Store__Name: ${STORE_NAME:-}
      Store__Currency: ${STORE_CURRENCY:-}
      Store__Locale: ${STORE_LOCALE:-}
      Store__CountryCode: ${STORE_COUNTRY_CODE:-}
      Store__TimeZone: ${STORE_TIME_ZONE:-}
      Store__WhatsAppNumber: ${STORE_WHATSAPP_NUMBER:-}
      Store__LogoUrl: ${STORE_LOGO_URL:-}
      # Traces and metrics are exported only when a collector is configured;
      # instrumentation runs either way.
      OpenTelemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-}
      OpenTelemetry__ServiceName: ${OTEL_SERVICE_NAME:-storefront-api}
    volumes:
      # Uploaded promotion images. Without this the container filesystem is
      # discarded on every rebuild and the database is left pointing at
      # image URLs that no longer resolve.
      - promotion_images:/app/wwwroot/images
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:80/health/ready || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pharmacy_network

  # ==========================
  # FRONTEND (Vue + Nginx)
  # ==========================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER}
    image: ghcr.io/eduardohanacleto/pharmacy-frontend:latest
    container_name: pharmacy_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - pharmacy_network

# ==========================
# VOLUMES
# ==========================
volumes:
  db_data:
  redis_data:
  promotion_images:

# ==========================
# NETWORK
# ==========================
networks:
  pharmacy_network:
    driver: bridge
